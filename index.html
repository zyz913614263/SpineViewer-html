<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpineViewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <strong>SpineViewer</strong>
    <button id="open-files" type="button">打开文件</button>
    <button id="open-folder" type="button">打开文件夹</button>
    <button id="open-sample" type="button">示例</button>
    <button id="play" type="button" disabled>播放</button>
    <button id="prev" type="button" disabled>上一帧</button>
    <button id="next" type="button" disabled>下一帧</button>
    <label>速度 <input id="speed" type="number" min="0.1" max="4" step="0.1" value="1"></label>
    <span id="clock">0.00 / 0.00</span>
  </header>
  <div class="layout">
    <main id="stage" class="checker">
      <div id="player"></div>
      <p id="empty">把 Spine JSON、atlas 和贴图拖到这里，或点「打开文件」。<br>也可以先看「示例」。</p>
    </main>
    <aside>
      <section>
        <h2>动画</h2>
        <div id="animations" class="list"></div>
        <input id="timeline" type="range" min="0" max="1" step="0.001" value="0" disabled>
        <label class="check"><input id="loop" type="checkbox" checked> 循环</label>
      </section>
      <section>
        <h2>皮肤</h2>
        <div id="skins" class="list"></div>
      </section>
      <section>
        <h2>插槽</h2>
        <div id="slots" class="list"></div>
      </section>
      <section>
        <h2>画面</h2>
        <label>背景
          <select id="background">
            <option value="checker">棋盘</option>
            <option value="white">白</option>
            <option value="black">黑</option>
            <option value="gray">灰</option>
          </select>
        </label>
        <label class="check"><input id="bones" type="checkbox"> 显示骨骼</label>
      </section>
      <section>
        <h2>导出</h2>
        <label>帧率 <input id="fps" type="number" min="1" max="30" step="1" value="12"></label>
        <div class="row">
          <button id="export-png" type="button" disabled>导出 PNG</button>
          <button id="export-gif" type="button" disabled>导出 GIF</button>
        </div>
      </section>
      <p id="info">尚未打开文件。支持 Spine 4.0–4.3 的 JSON。</p>
    </aside>
  </div>
  <footer id="status">把骨骼文件拖进窗口即可预览。</footer>
  <input id="file-input" type="file" multiple hidden accept=".json,.skel,.atlas,.atlas.txt,.png,.jpg,.jpeg,.webp">
  <input id="folder-input" type="file" hidden webkitdirectory>
  <script src="vendor/gifenc.js"></script>
  <script src="app.js"></script>
</body>
</html>
